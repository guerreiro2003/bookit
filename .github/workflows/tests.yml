name: Testes

# Tudo isto corre sem um único segredo, e por isso corre em qualquer fork e em
# qualquer pull request.
#
# Os testes unitários são puros: sem Firebase, sem rede. As suites E2E correm
# contra os emuladores do Firebase, semeados com dois salões inventados — é
# `npm run test:emul`, e inclui as regras de segurança a serem exercidas a
# sério. O emulador aceita o token "owner", por isso não é preciso conta
# nenhuma; o projeto chama-se demo-bookit, e o prefixo demo- garante que não
# há nada do outro lado se algo ficar mal configurado.
#
# O que correr contra o projeto real continua a ser um ato deliberado de uma
# pessoa: `BOOKIT_TARGET=real npm run test:all`, antes de um deploy. Ver DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitários + sintaxe + emuladores
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # O emulador do Firestore é um programa Java, e o firebase-tools 15
      # recusa-se a arrancar com menos do que a 21 — verifica antes de
      # descarregar seja o que for, com um erro que fala de Java e não diz
      # quem o pediu.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Os jars do emulador são centenas de MB e não mudam entre corridas.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - run: npm ci

      # Versão exata, a mesma que é usada à mão. Um "latest" aqui significa que
      # um dia o CI fica vermelho por causa de uma atualização de outra pessoa.
      - run: npm i -g firebase-tools@15.18.0

      - name: Testes unitários
        run: npm test

      - name: Sintaxe dos módulos
        run: |
          for f in app.js firebase.js booking-core.js retention-core.js metrics-core.js import-core.js; do
            node --check "$f" || exit 1
          done

      - name: Sintaxe do JavaScript dentro das páginas
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile, os, sys, glob
          bad = 0
          for f in sorted(glob.glob('*.html')):
              for i, block in enumerate(re.findall(r'<script type="module">(.*?)</script>', open(f, encoding='utf8').read(), re.S)):
                  p = tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False, encoding='utf8')
                  p.write(block); p.close()
                  r = subprocess.run(['node', '--check', p.name], capture_output=True, text=True)
                  os.unlink(p.name)
                  if r.returncode:
                      bad += 1
                      print(f'✗ {f} (bloco {i+1}): {r.stderr.strip().splitlines()[-1]}')
          print('✓ todas as páginas OK' if not bad else f'{bad} bloco(s) com erro')
          sys.exit(1 if bad else 0)
          PY

      # Substitui o antigo passo "As regras compilam", que acabava em `|| echo` e
      # por isso devolvia 0 sempre: regras com erro de sintaxe, ficheiro
      # apagado, ferramenta que nem arrancava — tudo passava a verde. A única
      # verificação automática do ficheiro que É toda a segurança deste produto
      # não verificava nada.
      #
      # Agora as regras não são só compiladas: são CARREGADAS pelo emulador,
      # que se recusa a arrancar se tiverem erro de sintaxe, e depois são
      # exercidas pelas suites — incluindo o isolamento entre salões, com dois
      # tenants a sério. emulators:exec propaga o código de saída.
      - name: Suites contra os emuladores (inclui as regras)
        run: npm run test:emul
